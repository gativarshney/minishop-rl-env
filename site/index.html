<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniShop</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .screen { display: none; }
        .screen.active { display: block; }
        .product-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .product-item { padding: 10px; border: 1px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        .controls { display: flex; gap: 10px; margin-top: 10px; }
        
        #popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        #popup-content {
            background: white; padding: 20px; border-radius: 5px;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center;
        }
        .buttons-hidden button {
            visibility: hidden !important;
        }
    </style>
</head>
<body>
    <div id="popup-overlay">
        <div id="popup-content">
            <h2>Special Offer!</h2>
            <p>Don't miss out.</p>
            <button onclick="dismissPopup()">Dismiss</button>
        </div>
    </div>

    <div id="catalog-screen" class="screen active">
        <h1>MiniShop Catalog</h1>
        <div class="product-list" id="products">
            <div class="product-item">
                <span>Blue Mug</span>
                <button data-id="blue-mug" onclick="viewProduct('blue-mug', 'Blue Mug')">View</button>
            </div>
            <div class="product-item">
                <span>Red Lamp</span>
                <button data-id="red-lamp" onclick="viewProduct('red-lamp', 'Red Lamp')">View</button>
            </div>
            <div class="product-item">
                <span>Green Book</span>
                <button data-id="green-book" onclick="viewProduct('green-book', 'Green Book')">View</button>
            </div>
            <div class="product-item">
                <span>Black Pen</span>
                <button data-id="black-pen" onclick="viewProduct('black-pen', 'Black Pen')">View</button>
            </div>
        </div>
        <div class="controls" style="margin-top: 20px;">
            <button onclick="showScreen('newsletter-screen')">Newsletter</button>
        </div>
    </div>

    <div id="newsletter-screen" class="screen">
        <h1>Newsletter</h1>
        <p>Subscribe for updates.</p>
        <div class="controls">
            <button onclick="showScreen('catalog-screen')">Back</button>
        </div>
    </div>

    <div id="product-screen" class="screen">
        <h1 id="product-title">Product</h1>
        <p>Quantity: <span id="product-qty">1</span></p>
        <div class="controls">
            <button onclick="changeQty(-1)">-</button>
            <button onclick="changeQty(1)">+</button>
        </div>
        <div class="controls">
            <button onclick="addToCart()">Add to cart</button>
            <button onclick="showScreen('catalog-screen')">Back</button>
        </div>
    </div>

    <div id="cart-screen" class="screen">
        <h1>Cart</h1>
        <p>Item: <span id="cart-item-name">None</span></p>
        <p>Quantity: <span id="cart-qty">0</span></p>
        <div class="controls">
            <button onclick="checkout()">Checkout</button>
            <button onclick="clearCart()">Clear cart</button>
            <button onclick="showScreen('catalog-screen')">Back</button>
        </div>
    </div>

    <div id="done-screen" class="screen">
        <h1>Order placed</h1>
        <p>Item: <span id="done-item-name"></span></p>
        <p>Quantity: <span id="done-qty"></span></p>
    </div>

    <script>
        // Mulberry32 PRNG
        function mulberry32(a) {
            return function() {
                var t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const goalItem = urlParams.get('item');
        const goalQty = parseInt(urlParams.get('qty'));
        // seed 0 is a valid seed, so only fall back when the value is missing
        const seedParsed = parseInt(urlParams.get('seed'));
        const seed = isNaN(seedParsed) ? 42 : seedParsed;
        const popupP = parseFloat(urlParams.get('popup_p')) || 0;
        const delayP = parseFloat(urlParams.get('delay_p')) || 0;

        const prng = mulberry32(seed);

        let currentProduct = null;
        let currentProductName = '';
        let quantity = 1;
        let cartItem = null;
        let cartQty = 0;
        let currentScreen = 'catalog-screen';
        let delayPending = false;
        let delayTimer = null;

        // Read-only view of the page state, so the environment and tests can
        // check the truth without parsing the DOM text.
        window.__state = {
            get screen() { return currentScreen; },
            get qty() { return quantity; },
            get cartItem() { return cartItem; },
            get cartQty() { return cartQty; },
            get delayPending() { return delayPending; },
            get popupShowing() { return document.getElementById('popup-overlay').style.display === 'block'; }
        };
        window.__orderResult = null;

        function showScreen(id) {
            // a new screen cancels the previous screen's reveal timer
            clearTimeout(delayTimer);
            delayPending = false;
            document.querySelectorAll('.screen').forEach(s => {
                s.classList.remove('active');
                s.classList.remove('buttons-hidden');
            });
            const screen = document.getElementById(id);
            screen.classList.add('active');
            currentScreen = id;

            // Draw for popup
            if (prng() < popupP) {
                document.getElementById('popup-overlay').style.display = 'block';
            }

            // Draw for delay
            if (prng() < delayP) {
                screen.classList.add('buttons-hidden');
                // Draw length of delay (50 to 300 ms)
                const delayMs = 50 + prng() * 250;
                delayPending = true;
                delayTimer = setTimeout(() => {
                    screen.classList.remove('buttons-hidden');
                    delayPending = false;
                }, delayMs);
            } else {
                // Keep PRNG state aligned even if delay does not happen: draw a dummy number
                prng();
            }
        }

        function dismissPopup() {
            document.getElementById('popup-overlay').style.display = 'none';
        }

        function viewProduct(id, name) {
            currentProduct = id;
            currentProductName = name;
            quantity = 1;
            document.getElementById('product-title').innerText = name;
            document.getElementById('product-qty').innerText = quantity;
            showScreen('product-screen');
        }

        function changeQty(delta) {
            quantity += delta;
            if (quantity < 1) quantity = 1;
            if (quantity > 3) quantity = 3;
            document.getElementById('product-qty').innerText = quantity;
        }

        function addToCart() {
            cartItem = currentProduct;
            cartQty = quantity;
            document.getElementById('cart-item-name').innerText = currentProductName;
            document.getElementById('cart-qty').innerText = cartQty;
            showScreen('cart-screen');
        }

        function clearCart() {
            cartItem = null;
            cartQty = 0;
            document.getElementById('cart-item-name').innerText = 'None';
            document.getElementById('cart-qty').innerText = '0';
        }

        function checkout() {
            document.getElementById('done-item-name').innerText = document.getElementById('cart-item-name').innerText;
            document.getElementById('done-qty').innerText = cartQty;
            
            // Expose success truth in DOM for the environment to read
            const success = (cartItem === goalItem && cartQty === goalQty);
            window.__orderResult = { success: success, item: cartItem, qty: cartQty };
            document.getElementById('done-screen').dataset.success = success;
            
            showScreen('done-screen');
        }
    </script>
</body>
</html>
