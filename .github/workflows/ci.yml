name: CI
on: [push, workflow_dispatch]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Chrome is preinstalled on ubuntu-latest
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Check browser
        run: $CHROME_BIN --version
      # Small steps first so a failure shows which part broke. A failing step puts the
      # end of its output into an annotation, which is visible without signing in.
      - name: Build environment
        timeout-minutes: 8
        run: python3 scripts/run_all.py --build-only
      - name: Diagnose page modes
        continue-on-error: true
        timeout-minutes: 5
        run: |
          for m in initial tab window; do
            MINISHOP_PAGE_MODE=$m bash scripts/ci_step.sh python3 scripts/test_env.py
            echo "::notice::page mode $m exit code $?"
          done
      - name: Smoke test (one purchase)
        timeout-minutes: 3
        run: bash scripts/ci_step.sh python3 scripts/test_env.py
      - name: Cleanup test (no browser left behind)
        timeout-minutes: 3
        run: bash scripts/ci_step.sh python3 scripts/test_cleanup.py
      - name: Parallel environments check
        timeout-minutes: 3
        run: bash scripts/ci_step.sh python3 scripts/parallel_bench.py --episodes 8 --envs 1 2 --out /tmp/parallel_check.jsonl
      - name: Build, train, evaluate, analyze
        timeout-minutes: 15
        run: ./run.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            logs/
            report.md
            charts/
